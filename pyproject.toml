[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-monitor"
version = "0.3.0"
description = "A read-only, replayable A-share stock monitoring MVP"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "keyring>=25,<27",
  "pandas>=2.3,<4",
  "pydantic>=2.11,<3",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]
providers = [
  "akshare>=1.18,<2",
  "tushare>=1.4,<2",
]
streaming = [
  "kafka-python-ng>=2.2,<3",
]
desktop-build = [
  "pyinstaller>=6.15,<8",
]

[project.scripts]
stock-monitor = "stock_monitor.cli:main"
stock-monitor-desktop = "stock_monitor.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
